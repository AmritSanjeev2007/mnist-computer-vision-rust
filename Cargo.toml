[package]
name = "computer_vision_rust"
version = "0.1.0"
edition = "2024"
default-run = "computer_vision_rust"

[dependencies]
const_format = "0.2.36"
frozen-collections = "0.9.3"
genawaiter = "0.99.1"
image = "0.25.10"
mockall = "0.15.0"
ndarray = "0.17.2"
num-derive = "0.5.1"
num-traits = "0.2.19"
rand = "0.10.2"
rand_distr = "0.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dependencies.opencl3]
version = "0.12"
features = ["CL_VERSION_2_1"]
